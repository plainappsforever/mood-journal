appId: ${APP_ID}
name: Widget - Android home-screen widget, a face opens the editor with that mood, the line follows the journal
tags:
  - p9
---
# Android only (the launcher's pin dialog). iOS: widget gallery + home screen checked with scripted springboard steps
# (V1_LOG P9); the iOS face links are the same `new?mood=<level>` route.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: subflows/reset.yaml
      - tapOn:
          id: tab-more
      - scrollUntilVisible:
          element:
            id: more-widget
      - tapOn:
          id: more-widget
      # First run: the launcher asks; later runs: the widget is already there (the app says so)
      - tapOn:
          text: Add to home screen
          optional: true
      - tapOn:
          text: OK
          optional: true
      - pressKey: Home
      # The launcher may have put the widget on its second page
      - extendedWaitUntil:
          visible: "Not logged today.*"
          timeout: 8000
          optional: true
      - runFlow:
          when:
            notVisible: "Not logged today.*"
          commands:
            - swipe:
                start: 85%,50%
                end: 15%,50%
                duration: 300
      - extendedWaitUntil:
          visible: "Not logged today.*"
          timeout: 15000
      - tapOn: Okay
      - extendedWaitUntil:
          visible:
            id: entry-editor
          timeout: 30000
      - assertVisible:
          id: mood-3
          selected: true
      - tapOn:
          id: entry-save
      # Back where the app was before (More); the entry is on Home
      - tapOn:
          id: tab-entries
      - extendedWaitUntil:
          visible:
            id: entry-row-1
          timeout: 10000
      - pressKey: Home
      - extendedWaitUntil:
          visible: "Logged today.*1 day in a row.*"
          timeout: 8000
          optional: true
      - runFlow:
          when:
            notVisible: "Logged today.*1 day in a row.*"
          commands:
            - swipe:
                start: 85%,50%
                end: 15%,50%
                duration: 300
      - extendedWaitUntil:
          visible: "Logged today.*1 day in a row.*"
          timeout: 15000
